[package]
name = "idlewild-editor"
version = "0.1.0"
edition = "2021"
description = "Idlewild — a Tauri + Phaser game editor built around PSD-to-Phaser"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tiny_http = "0.12"

# Publishing somewhere real, as libraries rather than as programs.
#
# iOS does not let a third-party app create a child process — `fork`, `exec`
# and `posix_spawn` are all denied by the sandbox, and `Foundation.Process` is
# not in the SDK. That is a real and permanent constraint, and it is the reason
# the first version of this feature was desktop-only. It is not, however, a
# constraint on *publishing*: every iOS app that does this work links the
# functionality instead of spawning the tool. Working Copy is libgit2 through
# objective-git; a-Shell's commands are dylibs in its own bundle, loaded by
# `ios_system`. So are these.
#
# `git2` is libgit2, vendored and built from source, which is what makes the
# iPad build possible at all: `libgit2-sys` defines GIT_SECURE_TRANSPORT for
# any target containing "apple", so an iOS build uses the system TLS stack
# rather than needing one shipped. `vendored-openssl` is there for the *other*
# targets — git2-rs gates openssl-sys on `all(unix, not(target_os = "macos"))`,
# which iOS matches even though libgit2 will not use it, so the dependency has
# to be satisfiable rather than merely unused. `ssh` is deliberately off: this
# reaches GitHub over HTTPS with a token, and leaving it off keeps libssh2 out
# of the tree entirely.
git2 = { version = "0.21", default-features = false, features = [
    "vendored-libgit2",
    "vendored-openssl",
    "https",
] }

# SSH, in Rust, for the same reason. rsync is the one tool here with no library
# form — `librsync` and `fast_rsync` are the delta algorithm, and the wire
# protocol crates (`arrsync`, `rsyn`) implement the downloading half against
# rsyncd — so the binary could not simply be linked the way libgit2 could.
# SFTP over our own SSH connection is the same job with the same outcome, on
# every platform, and raw sockets are unrestricted on iOS. See `deploy_ssh.rs`.
#
# `ring` rather than russh's default `aws-lc-rs` backend, and that choice is
# about the iPad: `ring` is what rustls uses everywhere and cross-compiles to
# `aarch64-apple-ios` as a matter of routine, where `aws-lc-sys` wants CMake
# and a good deal more persuasion for an Apple mobile target.
russh = { version = "0.63", default-features = false, features = [
    "ring",
    "rsa",
    "flate2",
] }
russh-sftp = "3"
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "fs"] }

# The PSD pipeline, shared with Phaser Bench.
#
# TEMPORARILY PINNED AHEAD OF MAIN, and meant to come off. The branch carries
# the fix for composited groups exporting their children twice: an atlas whose
# frames are named the way this editor names layers — `S | purple` — wrote a
# PNG per frame, hung a `children` array off a single-image layer, and keyed
# its frames `"S | purple"`, which is a frame no game code can ask for. Without
# it an atlas built here still comes out wrong, however right the rest of the
# chain is. Drop the `branch` once that lands on psd-to-json-rust's main, and
# run `cargo update -p psd-to-json` — the lockfile holds an exact commit, so
# merging alone does not move it.
psd-to-json = { git = "https://github.com/laffan/psd-to-json-rust", branch = "claude/focused-einstein-ie5qey" }
psd = { git = "https://github.com/laffan/psd", branch = "master" }
# TIFF and GIF are here for the clipboard rather than for the file pickers:
# a macOS pasteboard offers TIFF where it offers anything, and an image the
# pipeline refuses to decode is worse than one it never offered to take.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "gif"] }

# Reading the system pasteboard. WebKit hands a page only a web-safe subset
# of what the clipboard holds, which never includes a PSD — see clipboard.rs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSEnumerator", "NSString"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "UIPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSEnumerator", "NSString"] }

# Dependencies are optimised even in a debug build.
#
# The iPad runs `tauri ios build --debug` — see `build:ios` in package.json —
# so without this, every crate in this tree is compiled at `opt-level = 0` on
# the device somebody actually draws on. That is fine for *this* crate, which
# is glue. It is not fine for the PSD pipeline, which is entirely dependency
# code: the `psd` fork writes the file and psd-to-json parses and slices it,
# and both were unoptimised.
#
# Measured on one 1826 x 1412 sketch — a 14.6 MB PSD, the size a lassoed
# scribble actually makes — on the same machine, unoptimised then optimised:
# writing the file 2.16 s -> 0.86 s, and running psd-to-json over it
# 2.34 s -> 0.13 s. Four and a half seconds becomes one, and that is most of
# "Convert to PSD takes ten seconds on an iPad".
#
# This crate stays at `opt-level = 0`, so a debug build still steps through
# app code and still compiles as quickly as it did; only the dependencies
# below it are built once, optimised, and cached.
[profile.dev.package."*"]
opt-level = 3

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "idlewild_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
