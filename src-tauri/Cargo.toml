[package]
name = "idlewild-editor"
version = "0.1.0"
edition = "2021"
description = "Idlewild — a Tauri + Phaser game editor built around PSD-to-Phaser"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tiny_http = "0.12"
portpicker = "0.1"

# The PSD pipeline, shared with Phaser Bench.
psd-to-json = { git = "https://github.com/laffan/psd-to-json-rust" }
psd = { git = "https://github.com/laffan/psd", branch = "master" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "idlewild_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
